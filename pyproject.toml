[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "qums-fetch"
version = "0.4.4"
description = "Login and fetch data from QUMS-ERP Dashboard"
readme = "README.md"
authors = [
    { name = "Ishaan Gupta", email = "ishaan.ishu@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
